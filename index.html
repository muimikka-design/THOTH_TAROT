<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>托特塔羅牌 - 線上抽牌系統</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="images/icon-192.png">


    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #2c3e50; 
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            color: #f1c40f;
            margin-bottom: 20px;
        }

        /* 分頁按鈕樣式 */
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            background-color: #34495e;
            padding: 10px;
            border-radius: 30px;
        }

        .tab-btn {
            background-color: transparent;
            box-shadow: none;
            color: #bdc3c7;
            padding: 10px 20px;
            margin: 0;
        }

        .tab-btn.active {
            background-color: #d35400;
            color: white;
            font-weight: bold;
        }

        /* 分頁內容容器 */
        .tab-content {
            display: none; /* 預設隱藏所有分頁 */
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: fadeIn 0.5s ease-in-out;
        }

        .tab-content.active {
            display: flex; /* 只顯示有 active class 的分頁 */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .description {
            color: #bdc3c7;
            font-size: 1.2em;
            margin-bottom: 25px;
            text-align: center;
        }

        /* 牌陣版面配置 */
        .spread-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px; 
            margin-bottom: 30px;
        }

        .card-row {
            display: flex;
            gap: 20px; 
            justify-content: center;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .position-label {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #bdc3c7;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .card-name {
            margin-top: 10px;
            font-size: 15px;
            color: #f1c40f;
            min-height: 20px;
            font-weight: bold;
        }

        /* 卡牌容器與 3D 透視 */
        .card-container {
            width: 140px; 
            height: 220px;
            perspective: 1000px;
        }

        .card-container.large {
            width: 200px; /* Yes/No 單張牌稍微放大 */
            height: 314px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; 
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 2px solid #d35400; 
        }

        .card-back {
            background-image: url('images/card_back.jpg'); 
            background-size: cover;
            background-position: center;
        }

        .card-front {
            transform: rotateY(180deg);
            background-color: #000;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s;
        }

        /* 逆位翻轉效果 */
        .is-reversed {
            transform: rotate(180deg);
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #d35400;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #e67e22;
        }

        /* 問題輸入區塊樣式 */
        .question-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column; /* 改為垂直排列，讓按鈕掉到下一行 */
            align-items: flex-end;    /* center: 讓文字框與按鈕都保持置中 or flex-end:靠右對齊文字框的邊緣*/
            gap: 10px;              /* 設定文字框與按鈕之間的上下間距 */
            margin-bottom: 5px;     /* 🔮 原本是 15px，大幅減少底部留白 */
        }

        /* 針對 Textarea 的專屬設定 */
        textarea {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 15px; /* 稍微縮小圓角讓多行文字框更好看 */
            border: 2px solid #34495e;
            background-color: #1a252f;
            color: #ecf0f1;
            width: 250px; /* 🔮 原本是 450px，大約縮小一半 */
            height: 120px; /* 🔮 新增高度，讓文字框變高，方便寫較長的問題 */
            outline: none;
            font-family: inherit;
            transition: border-color 0.3s;
            resize: none; /* 鎖定大小，防止使用者把框框拉得太大破壞版面 */
            line-height: 1.5; /* 讓行距稍微寬鬆一點，閱讀起來更舒服 */
        }

        textarea:focus {
            border-color: #d35400; /* 點擊輸入時邊框會亮起橘色 */
        }

        button.clear-btn {
            background-color: #7f8c8d;
            margin-bottom: 0;
            padding: 6px 15px; /* 原本是 10px 20px，把上下左右的內縮空間改小 */
            font-size: 14px;   /* 原本是 16px，把裡面的字體改小一點 */
            height: fit-content;  /* 讓按鈕維持原本的高度 */
        }


        button.clear-btn:hover {
            background-color: #95a5a6;
        }

        /* --- 牌陣新版面配置 (1+3+1) --- */
        .top-section {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }
        /* 讓第一排左右兩張牌單獨往下移動 */
        .top-section .card-wrapper {
            margin-top: 70px; /* 🔮 調整這個數字：數字越大，牌掉得越下面 */
        }

        .center-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px; /* 🔮 原本是 15px，縮小輸入區與下方動作按鈕的距離 */
        }

        .bottom-section {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        /* 新增：抽牌與洗牌按鈕併排同一列的樣式 */
        .action-buttons-row {
            display: flex;
            flex-direction: row; /* 水平並排 */
            gap: 15px;           /* 按鈕之間的左右間距 */
            justify-content: center;
            width: 100%;
        }

        .action-buttons-row button {
            width: 120px;       /* 稍微縮小寬度以利併排 */
            margin-bottom: 0;
        }

        button.shuffle-btn {
            background-color: #34495e; 
        }
        
        button.shuffle-btn:hover {
            background-color: #455a64;
        }

        /* =================================================== */
        /*  響應式網頁設計 (RWD) - 手機專屬樣式 (螢幕寬度小於 768px 時自動啟用) */
        /* =================================================== */
        @media (max-width: 768px) {

            

            
            body {
                padding: 15px 0; /* 縮小網頁上下邊距 */
            }

            /* 讓上半部的卡牌與控制區改為垂直排列，避免橫向爆出 */
            .top-section {
                flex-direction: column;
                gap: 15px;
            }

            /* 手機畫面上，左右兩張牌可以並排在控制區的上方或下方，這裡讓它們稍微緊湊 */
            /* 新增這一段：在手機版時，取消左右兩張牌的往下推擠 */
            .top-section .card-wrapper {
                margin-top: 0; 
                order: 2; /* 這是你原本就有的 */
            }

            .center-controls {
                order: 1; /* 讓輸入框維持在手機最上方，方便打字 */
                width: 90%;
            }

            /* 將輸入框寬度調小，適應手機螢幕，不超出邊界 */
            textarea {
                width: 85vw; /* 寬度自動變為手機螢幕寬度的 85% */
            }

            .input-group {
                width: 100%;
                align-items: center;
            }

            /* 手機版卡牌等比例縮小 (原本 140x220 縮小至 90x140) */
            .card-container {
                width: 90px;
                height: 140px;
            }

            /* Yes or No 的大卡牌在手機上也同步縮小 */
            .card-container.large {
                width: 150px;
                height: 235px;
            }

            /* 縮小手機版牌陣的間距，確保一個畫面塞得下 */
            .bottom-section {
                gap: 10px;
                margin-top: 15px;
            }

            .position-label {
                font-size: 13px;
                padding: 3px 10px;
            }

            .card-name {
                font-size: 12px;
            }
        }



    </style>
</head>
<body>

    <h1>托特塔羅牌</h1>

    <!-- 分頁導覽列 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-131', this)">1+3+1 牌陣</button>
        <button class="tab-btn" onclick="switchTab('tab-yesno', this)">Yes or No</button>
    </div>

    <!-- ================= 分頁 1: 1+3+1 牌陣 ================= -->
    <div id="tab-131" class="tab-content active">
        <div class="spread-board">
            
            <div class="top-section">
                <div class="card-wrapper">
                    <div class="card-container"><div class="card" id="card-0"><div class="card-face card-back"></div><div class="card-face card-front"><img id="img-0" src=""></div></div></div>
                    <div class="position-label">當下切牌</div>
                    <div class="card-name" id="name-0"></div>
                </div>

                <!-- 中間：文字框與操作按鈕 -->
                <div class="center-controls">
                    <div class="question-section">
                        <div class="description">深呼吸，並寫下你想詢問的問題</div>
                        <div class="input-group">
                            <textarea id="user-question-131" rows="3" placeholder="請在此輸入你的問題..."></textarea>
                            <button class="clear-btn" onclick="clearQuestion('user-question-131')">Clear</button>
                        </div>
                    </div>
                    
                    <!-- 修改：將按鈕放入一個橫向並排的群組 -->
                    <div class="action-buttons-row">
                        <button onclick="drawSpread()">抽牌</button>
                        <button class="shuffle-btn" onclick="shuffleSpread()">洗牌</button>
                    </div>
                </div>

                <div class="card-wrapper">
                    <div class="card-container"><div class="card" id="card-4"><div class="card-face card-back"></div><div class="card-face card-front"><img id="img-4" src=""></div></div></div>
                    <div class="position-label">行動建議</div>
                    <div class="card-name" id="name-4"></div>
                </div>
            </div>

            <div class="bottom-section">
                <div class="card-wrapper">
                    <div class="card-container"><div class="card" id="card-1"><div class="card-face card-back"></div><div class="card-face card-front"><img id="img-1" src=""></div></div></div>
                    <div class="position-label">敘事 I</div>
                    <div class="card-name" id="name-1"></div>
                </div>
                <div class="card-wrapper">
                    <div class="card-container"><div class="card" id="card-2"><div class="card-face card-back"></div><div class="card-face card-front"><img id="img-2" src=""></div></div></div>
                    <div class="position-label">敘事 II</div>
                    <div class="card-name" id="name-2"></div>
                </div>
                <div class="card-wrapper">
                    <div class="card-container"><div class="card" id="card-3"><div class="card-face card-back"></div><div class="card-face card-front"><img id="img-3" src=""></div></div></div>
                    <div class="position-label">敘事 III</div>
                    <div class="card-name" id="name-3"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- ================= 分頁 2: Yes or No ================= -->
    <div id="tab-yesno" class="tab-content">
        <h2>Yes or No</h2>
        <div class="description">深呼吸，想好一個具體明確的要或不要的問題</div>
        
        <div class="action-buttons-row" style="flex-direction: row; justify-content: center; margin-bottom: 20px;">
            <button onclick="drawYesNo()">抽牌</button>
            <button class="shuffle-btn" onclick="shuffleYesNo()">洗牌</button>
        </div>

        <div class="card-wrapper">
            <div class="card-container large">
                <div class="card" id="yn-card">
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <img id="yn-img" src="" alt="Tarot Card">
                    </div>
                </div>
            </div>
            <div class="card-name" id="yn-name" style="font-size: 1.2em; margin-top: 20px;"></div>
        </div>
    </div>



   


    <script src="script.js"></script>

</body>
</html>
